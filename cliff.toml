# git-cliff configuration
# https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from Conventional Commits history (Keep a Changelog format).

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {#- Squash merges leave "(#N)" in the subject, and the link below appends\n                the same PR again. Strip the subject's copy when it matches the\n                resolved PR number so each entry carries exactly one reference. #}\
            {% if commit.remote.pr_number %}{{ commit.message | replace(from="(#" ~ commit.remote.pr_number ~ ")", to="") | trim | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %}\
            {% if commit.remote.pr_number %}([#{{ commit.remote.pr_number }}](https://github.com/TanKhoiTV/kavi-benchmark/pull/{{ commit.remote.pr_number }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
    {% if release.previous -%}
        {% if release.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/TanKhoiTV/kavi-benchmark/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [unreleased]: https://github.com/TanKhoiTV/kavi-benchmark/compare/{{ release.previous.version }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: update CHANGELOG", skip = true },
    { message = "^chore", group = "Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[github]
owner = "TanKhoiTV"
repo = "kavi-benchmark"
