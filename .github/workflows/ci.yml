name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the lint job only reads the repository, so scope the token
# to reads instead of inheriting the (broader) repository default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, so keep the token out of .git/config
          # where a later step could pick it up.
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: make check (ruff lint + format + yamllint)
        run: make check
      - name: make test (pytest)
        run: make test
