[project]
name = "prototype"
version = "0.1.0"
description = "OneVoice AI Challenge - ASR->MT->TTS prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper",
  "ctranslate2",
  "transformers",
  "soundfile",
  "torch",
  "torchaudio",
  "sentencepiece>=0.1.96",
  "jiwer>=4.0.0",
  "sacrebleu>=2.6.0",
  "piper-tts>=1.4.2",
  "pyarrow",
  "silero-vad>=5.1.0",
  "noisereduce>=3.0",
  "numpy",
  "optimum[onnx]>=1.20.0",
  # sherpa-onnx must stay < 1.13: 1.13.x is built against onnxruntime C API 27,
  # incompatible with the onnxruntime 1.17.1 pinned by the qairt group for QAIRT
  # SDK 2.31 compat. The core wheel ships onnxruntime.dll next to
  # _sherpa_onnx.pyd, so the runtime is self-contained and does not collide with
  # the environment's ORT.
  "sherpa-onnx==1.12.40",
  "sherpa-onnx-core==1.12.40",
  "datasets>=2.19.0",
  "onnx-graphsurgeon>=0.5.0",
  "unbabel-comet>=2.2.0",
  "psutil>=5.9",
]

[tool.uv]
# Use CPU-only PyTorch (no CUDA on this machine)
extra-index-url = ["https://download.pytorch.org/whl/cpu"]

[tool.ruff]
target-version = "py312"
line-length = 88
# Archived legacy code (pre-restructure), the local-only RTranslator
# reference checkout, and .tmp (scratch artefacts and GitHub API dumps) are
# intentionally not linted.
extend-exclude = ["archive", "RTranslator", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
# Only the project's own suite: without this, pytest also collects vendored
# trees (e.g. a local RTranslator checkout), which is machine-dependent.
testpaths = ["tests"]

[dependency-groups]
dev = ["pre-commit>=4.6.0", "ruff>=0.15.18", "datasets", "pytest>=9.1.1"]
qairt = [
  "onnx==1.16.1",
  "onnxruntime==1.17.1",
  "numpy<2",
  "onnx-simplifier",
  "scipy",
  "lxml",
  "absl-py",
  "pandas",
  "pyyaml",
]
