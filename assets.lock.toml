# ── Documented, not fetched here ───────────────────────────────────────────
#
# Artifacts that ship but are staged by the on-device track, so this repository
# never holds their bytes and cannot verify them. They are pinned by repository
# and revision anyway: "the model that ships is not recorded anywhere public" was
# the gap this file exists to close, and a name plus a revision closes most of it.
# Digests live next to the artifact, in the app's assets/SHA256SUMS.

[not_fetched.parakeet_tdt_0_6b_v2]
label = "parakeet-tdt-0.6b-v2"
role = "English ASR, shipped"
upstream = "https://huggingface.co/nvidia/parakeet-tdt-0.6b-v2"
distribution = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2"
