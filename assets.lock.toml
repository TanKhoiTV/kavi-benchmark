# Pinned third-party assets and their SHA-256 digests.
#
# These artifacts are deliberately NOT committed (see NOTICE). Fetch them with:
#   make models    # Opus-MT vi->en weights + tokenizers  -> models/
#   make data      # FLEURS vi_vn/en_us test parquets      -> eval_data/raw/
#
# Verify whatever is on disk with:
#   make verify-assets
#
# To bump an artifact: change `revision`, re-run the fetch, then update the
# digest values reported by `make verify-assets`.

