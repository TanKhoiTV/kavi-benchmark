# The MT that ships, in both directions (ADR-034). One bilingual checkpoint driven
# by a source-language token plus a target prefix, so vi->en and en->vi are the
# same weights - which is also why the register scores in
# docs/reference/mt-en-vi-baseline.md come from one model.
#
# The int8 conversion is bit-reproducible: a fresh conversion from this revision
# produced an identical model.bin and shared_vocabulary.json (the vocabulary is
# 18916ac6...f941, recorded here as a comment because the schema verifies the one
# file that dominates the download). A clean clone therefore derives the exact
# artifact that ships, rather than something merely similar.
[models.m2m100_418m]
label = "M2M-100 418M"
repo = "facebook/m2m100_418M"
revision = "55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636"
src_dir = "m2m100-418m-src"
ct2_dir = "m2m100-418m-ct2-int8"
source_path = "m2m100-418m-src/pytorch_model.bin"
source_sha256 = "d907ea45e4e4b9db163382a6674f6218b3c59566fe06d77f4055c208b4e87ed1"
source_size = 1935796948
ct2_path = "m2m100-418m-ct2-int8/model.bin"
ct2_sha256 = "590e9c7e229e84de8affe7b15487660a286d3d76e44a4ca10e33099b198d9a76"
ct2_size = 490667752

