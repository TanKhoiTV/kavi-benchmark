# Pre-commit hooks for kavi-benchmark
# commitlint enforces Conventional Commits on every commit message.
# Activate with: uv run pre-commit install
# (writes .git/hooks/commit-msg so the hook runs on `git commit`)
# The legacy project under ./archive is frozen reference and is excluded.
exclude: '^archive/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  # Style rules for the repository's YAML; `.yamllint` is discovered from the
  # repository root. It holds line-length at warning level, so this hook passes
  # on `.kavi.yaml` where the long provenance comments are deliberate.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # commitlint runs in a Node env provisioned by pre-commit itself,
  # so no package.json / node_modules is needed in this Python repo.
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: commitlint --edit
        language: node
        additional_dependencies:
          - '@commitlint/cli@19'
          - '@commitlint/config-conventional@19'
        stages: [commit-msg]
